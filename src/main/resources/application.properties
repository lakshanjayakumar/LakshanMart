# LakshanMart Application Configuration
# Environment: local development / embedded default

# Database Configuration (MySQL 8.x Default)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/lakshanmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.username=root
db.password=root

# HikariCP Connection Pool Settings
hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=300000
hikari.connectionTimeout=20000
hikari.maxLifetime=1200000

# Application Settings
app.session.timeout.minutes=30

# AI Feature Configuration (Section 17)
ai.chatbot.provider=mock
